<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 缩略图不带 Referrer，避免图片 CDN 校验来源导致加载失败 -->
<meta name="referrer" content="no-referrer">
<title>Gemini 图片批量下载</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hd">
    <img class="logo" src="icons/icon48.png" alt="">
    <div class="hd-t">
      <div class="title">Gemini 图片下载</div>
      <div class="sub" id="pageState">正在准备…</div>
    </div>
    <button class="icon-btn" id="btnRescan" title="重新扫描当前页面">⟳</button>
  </header>

  <div class="tools">
    <span class="tip" title="✦=AI生成图 ↑=用户上传图 •=其他；默认只勾选生成图">✦ 生成图 · ↑ 上传图 • 其他</span>
    <label class="mode" title="「选文件夹」：只在第一次弹一次目录选择框，本次所有图片直接存进去，并记住该目录；「浏览器下载」：走 Chrome 默认下载流程（若开启了“下载前询问保存位置”会逐张询问）">
      保存
      <select id="saveMode">
        <option value="picker">选文件夹，批量直存</option>
        <option value="downloads">浏览器下载</option>
      </select>
    </label>
    <label class="folder" id="folderLabel" title="「浏览器下载」模式下图片保存到「下载/Gemini图片/」目录，可自定义">
      📁 <input type="text" id="folder" placeholder="Gemini图片" spellcheck="false">
    </label>
  </div>

  <div class="actions">
    <button class="btn" id="btnDeep" title="自动滚动到对话底部，触发所有图片加载后再扫描">⬇ 滚动加载并扫描</button>
    <button class="btn" id="btnSelectAll">全选</button>
    <button class="btn ghost" id="btnSelectNone">取消全选</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty" hidden>
    <div class="empty-emoji">🖼️</div>
    <div class="empty-t">未找到图片</div>
    <div class="empty-d">请先打开包含图片的 Gemini 对话页。若对话很长，试试上面的「滚动加载并扫描」。</div>
  </div>

  <footer class="ft">
    <div class="prog" id="prog" hidden>
      <div class="bar"><i id="barFill"></i></div>
      <span id="progText">0/0</span>
    </div>
    <div class="status">
      <span id="statusText"></span>
      <a id="pickInPage" hidden title="弹窗内无法显示缩略图时，在 Gemini 页面里直接选图（使用页面已显示的图片，一定能看到）">在页面中选图</a>
      <a id="resume" hidden title="弹窗上次被系统关闭导致保存中断，点击在新页面继续完成"></a>
      <a id="changeDir" hidden title="清除已记住的保存文件夹，下次下载时重新选择">更换保存文件夹</a>
      <a id="settingsHint" hidden title="关闭「下载前询问每个文件的保存位置」后，浏览器下载模式不会再逐张弹窗">若逐张弹保存框？关闭该设置</a>
    </div>
    <div class="ft-row">
      <span class="count" id="count"></span>
      <button class="btn primary" id="btnDownload" disabled>下载选中</button>
    </div>
  </footer>

  <script src="lib.js"></script>
  <script src="save-lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
